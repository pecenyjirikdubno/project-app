<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Úkoly</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:16px; }
.card { background:#fff; padding:16px; border-radius:12px; margin-bottom:12px; }
.hidden { display:none; }
.btn { padding:10px; border:none; border-radius:8px; margin-top:6px; cursor:pointer; }
.btn-primary { background:#2563eb; color:white; }
.btn-danger { background:#dc2626; color:white; }
.btn-success { background:#16a34a; color:white; }
</style>
</head>

<body>

<h1>Úkoly</h1>

<a href="{{ url_for('dashboard') }}">← zpět</a>

<button onclick="toggleApproved()">Zobrazit / skrýt potvrzené</button>

<div class="card">
<form method="POST" action="{{ url_for('create_task') }}">
<input name="title" placeholder="Název úkolu" required>
<textarea name="description" placeholder="Popis"></textarea>

<select name="assigned_to_user_id">
<option value="">Nepřiřazeno</option>
{% for user in assignable_users %}
<option value="{{ user.id }}">{{ user.username }}</option>
{% endfor %}
</select>

<input type="date" name="assigned_date">
<input type="date" name="due_date">

<button class="btn btn-primary">Přidat úkol</button>
</form>
</div>

{% for task in tasks %}
<div class="card task" data-approved="{{ task.admin_confirmed|int }}">

<div onclick="toggleDetail({{ task.id }})">
<strong>{{ task.title }}</strong><br>
Přiřazeno: {{ user_map.get(task.assigned_to_user_id, '—') }}
</div>

<div id="detail-{{ task.id }}" class="hidden">

<form method="POST" action="{{ url_for('update_task', task_id=task.id) }}">
<input name="title" value="{{ task.title }}">
<textarea name="description">{{ task.description }}</textarea>

<select name="assigned_to_user_id">
<option value="">Nepřiřazeno</option>
{% for user in assignable_users %}
<option value="{{ user.id }}" {% if task.assigned_to_user_id == user.id %}selected{% endif %}>
{{ user.username }}
</option>
{% endfor %}
</select>

<input type="date" name="assigned_date" value="{{ task.assigned_date }}">
<input type="date" name="due_date" value="{{ task.due_date }}">

<button class="btn btn-success">Uložit</button>
</form>

<form method="POST" action="{{ url_for('approve_task', task_id=task.id) }}">
<button class="btn btn-primary">Potvrdit</button>
</form>

<form method="POST" action="{{ url_for('delete_task', task_id=task.id) }}">
<button class="btn btn-danger">Smazat</button>
</form>

</div>

</div>
{% endfor %}

<script>
function toggleDetail(id){
document.getElementById("detail-"+id).classList.toggle("hidden");
}

let showApproved = false;

function toggleApproved(){
showApproved = !showApproved;

document.querySelectorAll(".task").forEach(el=>{
const approved = el.dataset.approved == "1";
el.style.display = (approved && !showApproved) ? "none" : "block";
});
}

window.onload = toggleApproved;
</script>

</body>
</html>
